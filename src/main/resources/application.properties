spring.config.import=optional:configserver:,optional:file:.env[.properties]
spring.cloud.config.enabled=false
server.port=${PORT:8080}
# Render termina TLS en su proxy: respeta X-Forwarded-Proto/Host
server.forward-headers-strategy=framework

#--- Base de datos principal (PostgreSQL) -----------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=20000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.connection-test-query=SELECT 1

spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#--- Integración Gestopago Autenticación -------------------------------------
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_DISTRIBUIDOR_ID:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_DISPOSITIVO_CODIGO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_DISPOSITIVO_PASSWORD:}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

#--- Integración catálogo de productos -------------------------------------
gestopago.productos.url=${GESTOPAGO_PRODUCTOS_URL:https://gestopago.portalventas.net}
# El Bearer Token principal se resuelve desde PostgreSQL (tabla gestopago_tokens,
# generado por el sistema al iniciar); esta propiedad es solo un respaldo opcional.
gestopago.productos.token=${GESTOPAGO_PRODUCTOS_TOKEN:}
gestopago.productos.ruta=${GESTOPAGO_PRODUCTOS_RUTA:/sistema/service/getProductList.do}
gestopago.productos.cron=${GESTOPAGO_PRODUCTOS_CRON:0 0 6 * * *}

#Reintentos del servicio externo
gestopago.productos.reintentos.max-intentos=3
gestopago.productos.reintentos.espera-ms=2000

#Timeouts Feign para el catálogo
feign.client.config.gestoPagoCatalogo.connectTimeout=5000
feign.client.config.gestoPagoCatalogo.readTimeout=10000
feign.client.config.gestoPagoCatalogo.loggerLevel=full

#--- MongoDB: solo caché del catálogo de productos --------------------------
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:catalogo_cache}
spring.data.mongodb.connection-connect-timeout=3000
spring.data.mongodb.connection-socket-timeout=3000
spring.data.mongodb.auto-index-creation=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Swagger/OpenAPI: en Render la URL pública se detecta sola (RENDER_EXTERNAL_URL).
# Estas variables permiten forzarla y cambiar la URL local de desarrollo.
app.openapi.server-url=${OPENAPI_SERVER_URL:${RENDER_EXTERNAL_URL:}}
app.openapi.local-url=${OPENAPI_LOCAL_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.proyecto.servicios=INFO

#--- JWT Configuration -------------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
