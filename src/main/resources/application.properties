spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/pago_servicios
spring.datasource.username=postgres
spring.datasource.password=josue
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=18800
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1


spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.refresh-rate-ms=3600000

#--- Integración catálogo de productos -------------------------------------
gestopago.productos.url=${GESTOPAGO_PRODUCTOS_URL:https://gestopago.portalventas.net}
# El Bearer Token principal se resuelve desde PostgreSQL (tabla gestopago_tokens,
# generado por el sistema al iniciar); esta propiedad es solo un respaldo.
gestopago.productos.token=${GESTOPAGO_PRODUCTOS_TOKEN:Bearer CAMBIA_POR_TU_TOKEN}
gestopago.productos.ruta=/sistema/service/getProductList.do
gestopago.productos.cron=0 0 6 * * *

#Reintentos del servicio externo
gestopago.productos.reintentos.max-intentos=3
gestopago.productos.reintentos.espera-ms=2000

#Timeouts Feign para el catálogo
feign.client.config.gestoPagoCatalogo.connectTimeout=5000
feign.client.config.gestoPagoCatalogo.readTimeout=10000
feign.client.config.gestoPagoCatalogo.loggerLevel=full

#--- MongoDB: solo caché del catálogo de productos --------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=catalogo_cache
spring.data.mongodb.connection-connect-timeout=3000
spring.data.mongodb.connection-socket-timeout=3000
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


logging.level.com.proyecto.servicios=INFO

#--- JWT Configuration -------------------------------------------------------
jwt.secret=miClaveSecretaSuperSeguraParaJWT2024
jwt.expiration=86400000