spring.config.import=optional:configserver:,optional:file:.env[.properties]
spring.cloud.config.enabled=false
server.port=${PORT:8080}
# Render termina TLS en su proxy: respeta X-Forwarded-Proto/Host
server.forward-headers-strategy=framework

#--- Base de datos principal (PostgreSQL / Supabase) -----------------------
# URL JDBC: Prioriza SUPABASE_DB_URL -> DB_URL -> SPRING_DATASOURCE_URL -> Host/Port/DB
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-us-east-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres.odwnbycqnyxaohqnyjbv}}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=20000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=10000

spring.datasource.hikari.connection-test-query=SELECT 1

spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#--- Integración Gestopago Autenticación -------------------------------------
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_DISTRIBUIDOR_ID:0}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_DISPOSITIVO_CODIGO:}
gestopago.auth.password=${GESTOPAGO_DISPOSITIVO_PASSWORD:}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

#--- Integración catálogo de productos -------------------------------------
gestopago.productos.url=${GESTOPAGO_PRODUCTOS_URL:https://gestopago.portalventas.net}
# El Bearer Token principal se resuelve desde PostgreSQL (tabla gestopago_tokens,
# generado por el sistema al iniciar); esta propiedad es solo un respaldo opcional.
gestopago.productos.token=${GESTOPAGO_PRODUCTOS_TOKEN:}
gestopago.productos.ruta=${GESTOPAGO_PRODUCTOS_RUTA:/sistema/service/getProductList.do}
gestopago.productos.cron=${GESTOPAGO_PRODUCTOS_CRON:0 0 6 * * *}

#Reintentos del servicio externo
gestopago.productos.reintentos.max-intentos=3
gestopago.productos.reintentos.espera-ms=2000

#Timeouts y nivel de log Feign para el catálogo (por seguridad el loggerLevel por defecto es basic para no fugar tokens en headers)
feign.client.config.gestoPagoCatalogo.connectTimeout=5000
feign.client.config.gestoPagoCatalogo.readTimeout=10000
feign.client.config.gestoPagoCatalogo.loggerLevel=${FEIGN_LOGGER_LEVEL:basic}

#--- Integración transacciones Gestopago (sendTx.do) --------------------------
gestopago.tx.url=${GESTOPAGO_TX_URL:https://gestopago.portalventas.net}
gestopago.tx.ruta=${GESTOPAGO_TX_RUTA:/sistema/service/sendTx.do}
gestopago.tx.token=${GESTOPAGO_TX_TOKEN:}
gestopago.tx.aes.key=${GESTOPAGO_AES_KEY:}
gestopago.tx.aes.transformation=${GESTOPAGO_AES_TRANSFORMATION:AES/CBC/PKCS5Padding}
gestopago.tx.aes.iv=${GESTOPAGO_AES_IV:}
gestopago.tx.recuperacion.intervalo-ms=${GESTOPAGO_TX_RECUPERACION_MS:60000}

#Timeouts y nivel de log Feign para transacciones
feign.client.config.gestoPagoTx.connectTimeout=5000
feign.client.config.gestoPagoTx.readTimeout=15000
feign.client.config.gestoPagoTx.loggerLevel=${FEIGN_LOGGER_LEVEL:basic}

#--- MongoDB: solo caché del catálogo de productos (MongoDB Atlas) --------
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:catalogo_cache}
spring.data.mongodb.connection-connect-timeout=5000
spring.data.mongodb.connection-socket-timeout=5000
spring.data.mongodb.auto-index-creation=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Swagger/OpenAPI: en Render la URL pública se detecta sola (RENDER_EXTERNAL_URL).
app.openapi.server-url=${OPENAPI_SERVER_URL:${RENDER_EXTERNAL_URL:}}
app.openapi.local-url=${OPENAPI_LOCAL_URL:http://localhost:8080}

# Seguridad HTTP / CORS / Consola H2
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
app.security.h2-console-enabled=${H2_CONSOLE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

logging.level.com.proyecto.servicios=INFO

#--- JWT Configuration -------------------------------------------------------
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
