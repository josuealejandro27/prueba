# Render Blueprint Specification
# Sistema Bancario Core - Integración Gestopago
services:
  - type: web
    name: core-bancario-gestopago
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FEIGN_LOGGER_LEVEL
        value: basic
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_DB_HOST
        value: db.odwnbycqnyxaohqnyjbv.supabase.co
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USERNAME
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: catalogo_cache
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: GESTOPAGO_AUTH_URL
        value: https://gestopago.portalventas.net
      - key: GESTOPAGO_PRODUCTOS_URL
        value: https://gestopago.portalventas.net
      - key: GESTOPAGO_PRODUCTOS_RUTA
        value: /sistema/service/getProductList.do
      - key: GESTOPAGO_TX_URL
        value: https://gestopago.portalventas.net
      - key: GESTOPAGO_TX_RUTA
        value: /sistema/service/sendTx.do
      - key: GESTOPAGO_DISTRIBUIDOR_ID
        sync: false
      - key: GESTOPAGO_DISPOSITIVO_CODIGO
        sync: false
      - key: GESTOPAGO_DISPOSITIVO_PASSWORD
        sync: false
      - key: GESTOPAGO_AES_TRANSFORMATION
        value: AES/CBC/PKCS5Padding
      - key: GESTOPAGO_AES_KEY
        sync: false
      - key: GESTOPAGO_AES_IV
        sync: false
